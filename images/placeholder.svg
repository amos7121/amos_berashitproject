<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Berashit placeholder image">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B3D91" stop-opacity="1"/>
      <stop offset="100%" stop-color="#153A5F" stop-opacity="1"/>
    </linearGradient>
    <style>
      .title{font-family: 'Merriweather', serif; fill:#FFFFFF; font-size:48px; font-weight:700}
      .subtitle{font-family: 'Inter', sans-serif; fill:#E6EEF8; font-size:20px}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" rx="24"/>
  <g transform="translate(80,120)">
